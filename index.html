    <script>
      // 自愈：清除历史 Service Worker 与缓存（不动 IndexedDB 学习数据）。
      // 解决旧 index.html / 旧 SW 缓存导致 JS 404 白屏的问题。
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) { caches.delete(key); });
          }).catch(function () {});
        }
      })();
    </script>
    <script>
      // 兼容旧移动浏览器：Array/String.prototype.at polyfill（ES5 语法，模块加载前执行）
      (function () {
        if (typeof Array.prototype.at !== 'function') {
          Array.prototype.at = function (index) {
            var n = Number(index), len = this.length;
            return n < 0 ? (len + n >= 0 ? this[len + n] : undefined) : (n < len ? this[n] : undefined);
          };
        }
        if (typeof String.prototype.at !== 'function') {
          String.prototype.at = function (index) {
            var n = Number(index), len = this.length;
            return n < 0 ? (len + n >= 0 ? this[len + n] : undefined) : (n < len ? this[n] : undefined);
          };
        }
      })();
    </script>

  <body class="overscroll-none">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#888;font-size:14px;">
        <div style="margin-bottom:8px;">⏳ 正在加载学习规划器…</div>
        <div id="boot-error" style="color:#c00;font-size:12px;white-space:pre-wrap;word-break:break-all;max-width:90vw;"></div>
      </div>
    </div>
    <script>
      // 诊断：捕获模块加载/语法/运行时错误（ES5 语法，在模块脚本之前注册）
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-error');
        if (el) {
          el.textContent = '加载出错: ' + (e.message || '未知错误');
          if (e.filename) el.textContent += '\n文件: ' + e.filename.split('/').pop();
          if (e.lineno) el.textContent += ' @' + e.lineno;
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
